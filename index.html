<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>10 Phút Mail — Temporary email, made simple</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #ffffff;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --accent-soft: #EEF2FF;
      --accent-ring: rgba(79, 70, 229, 0.18);
      --danger: #DC2626;
      --warning: #D97706;
      --success: #059669;
      --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.04);
      --shadow-sm: 0 2px 8px rgba(16, 24, 40, 0.06);
      --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.07);
      --shadow-lg: 0 16px 40px rgba(16, 24, 40, 0.08);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --transition-fast: 0.15s cubic-bezier(0.2, 0, 0, 1);
      --transition-base: 0.25s cubic-bezier(0.2, 0, 0, 1);
      --focus-ring: 0 0 0 3px var(--accent-ring);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 32px;
      padding: 0 2px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-tagline {
      font-size: 0.9rem;
      font-weight: 450;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 550;
      letter-spacing: -0.01em;
      border: 1px solid rgba(79, 70, 229, 0.12);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    .email-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }

    .email-label {
      font-size: 0.85rem;
      font-weight: 550;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .email-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      margin-bottom: 20px;
    }

    .email-address-display {
      font-family: 'SF Mono', 'Cascadia Code', 'Roboto Mono', 'Menlo', monospace;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-all;
      flex: 1 1 260px;
      letter-spacing: -0.01em;
      background: var(--bg);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      min-width: 0;
    }

    .email-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 550;
      font-family: var(--font);
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      text-decoration: none;
      letter-spacing: -0.01em;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn:focus-visible {
      box-shadow: var(--focus-ring);
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-primary:disabled {
      background: var(--border-strong);
      border-color: var(--border-strong);
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text-primary);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover {
      background: var(--bg);
      border-color: var(--border-strong);
    }

    .btn-secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0 16px;
    }

    .timer-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .timer-label {
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .timer-value {
      font-family: 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      transition: color var(--transition-base);
    }

    .timer-value.warning {
      color: var(--warning);
    }

    .timer-value.danger {
      color: var(--danger);
    }

    .timer-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }

    .timer-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 1s linear, background var(--transition-base);
    }

    .timer-bar-fill.warning {
      background: var(--warning);
    }

    .timer-bar-fill.danger {
      background: var(--danger);
    }

    .generate-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .inbox-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 24px 28px;
      min-height: 260px;
    }

    .inbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .inbox-title {
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .inbox-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .email-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .email-item:hover {
      background: var(--accent-soft);
      border-color: var(--accent-ring);
    }

    .unread-indicator {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 6px;
      opacity: 0.9;
    }

    .email-item:not(.unread) .unread-indicator {
      opacity: 0;
    }

    .email-item-content {
      flex: 1;
      min-width: 0;
    }

    .email-item-sender {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .email-item-subject {
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .email-item-time {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      flex-shrink: 0;
      margin-top: 2px;
      white-space: nowrap;
    }

    .email-item.unread .email-item-sender {
      font-weight: 700;
    }

    .email-item.unread .email-item-subject {
      font-weight: 500;
      color: var(--text-primary);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      gap: 8px;
    }

    .empty-state svg {
      width: 40px;
      height: 40px;
      stroke: var(--text-tertiary);
      stroke-width: 1.2;
      fill: none;
      margin-bottom: 8px;
    }

    .empty-state-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-state-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      max-width: 340px;
    }

    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 10px;
    }

    .error-state-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--danger);
    }

    .error-state-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .skeleton {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0;
    }

    .skeleton-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .skeleton-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      animation: shimmer 1.8s infinite;
    }

    .skeleton-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-line {
      height: 10px;
      border-radius: 4px;
      background: var(--border);
      animation: shimmer 1.8s infinite;
    }

    .skeleton-line.short {
      width: 40%;
    }

    .skeleton-line.medium {
      width: 75%;
    }

    @keyframes shimmer {
      0% { background-color: var(--border); }
      50% { background-color: #F3F4F6; }
      100% { background-color: var(--border); }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(17, 24, 39, 0.55);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: var(--card);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-shrink: 0;
    }

    .modal-subject {
      font-size: 1.1rem;
      font-weight: 650;
      line-height: 1.3;
      color: var(--text-primary);
      word-break: break-word;
    }

    .modal-close-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      background: var(--bg);
      color: var(--text-primary);
    }

    .modal-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .modal-meta {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .modal-meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .modal-meta-label {
      font-weight: 550;
      color: var(--text-primary);
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
      word-break: break-word;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .modal-body iframe {
      width: 100%;
      min-height: 280px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: var(--text-primary);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: toastIn 0.3s ease;
      max-width: 360px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.removing {
      opacity: 0;
      transform: translateY(8px);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast-success {
      background: #065F46;
    }

    .toast-error {
      background: #991B1B;
    }

    .toast-info {
      background: #1E3A8A;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px;
      }

      .site-header {
        margin-bottom: 20px;
      }

      .brand-name {
        font-size: 1.4rem;
      }

      .email-card {
        padding: 20px 18px;
        border-radius: var(--radius-md);
      }

      .email-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .email-address-display {
        font-size: 1rem;
        padding: 10px 14px;
      }

      .email-actions {
        width: 100%;
        justify-content: stretch;
      }

      .email-actions .btn {
        flex: 1;
        justify-content: center;
      }

      .timer-section {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .timer-value {
        font-size: 1.3rem;
      }

      .generate-row {
        justify-content: stretch;
      }

      .generate-row .btn {
        width: 100%;
      }

      .inbox-section {
        padding: 18px 16px;
        border-radius: var(--radius-md);
      }

      .inbox-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .email-item {
        padding: 12px 12px;
      }

      .modal-container {
        max-width: 100%;
        max-height: 92vh;
        border-radius: var(--radius-lg);
      }

      .modal-header {
        padding: 16px 18px 12px;
      }

      .modal-meta {
        padding: 10px 18px;
      }

      .modal-body {
        padding: 16px 18px;
      }

      .toast-container {
        bottom: 16px;
        right: 12px;
        left: 12px;
        align-items: flex-end;
      }

      .toast {
        max-width: 100%;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .email-card {
        padding: 24px 24px;
      }

      .inbox-section {
        padding: 20px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="brand">
        <div class="brand-name">10 Phút Mail</div>
        <div class="brand-tagline">Temporary email, made simple.</div>
      </div>
      <div class="status-pill">
        <span class="status-dot" aria-hidden="true"></span>
        Temporary inbox
      </div>
    </header>

    <section class="email-card" aria-label="Temporary email">
      <div class="email-label">Your temporary email</div>
      <div class="email-row">
        <div class="email-address-display" id="emailAddress" aria-live="polite">Đang tạo email...</div>
        <div class="email-actions">
          <button class="btn btn-secondary" id="copyBtn" onclick="copyEmail()" aria-label="Copy email address">
            Copy
          </button>
          <button class="btn btn-secondary" id="refreshBtn" onclick="refreshInbox()" aria-label="Refresh inbox">
            Refresh
          </button>
        </div>
      </div>
      <hr class="divider">
      <div class="timer-section">
        <div class="timer-label">Expires in</div>
        <div class="timer-value" id="timer">10:00</div>
      </div>
      <div class="timer-bar" aria-hidden="true">
        <div class="timer-bar-fill" id="timerBarFill"></div>
      </div>
      <div class="generate-row">
        <button class="btn btn-primary" id="generateBtn" onclick="generateNewEmail()" aria-label="Generate new email">
          Generate New Email
        </button>
      </div>
    </section>

    <section class="inbox-section" aria-label="Inbox">
      <div class="inbox-header">
        <h2 class="inbox-title">Inbox</h2>
        <button class="btn btn-secondary" onclick="refreshInbox()" aria-label="Refresh inbox">
          Refresh
        </button>
      </div>
      <div class="inbox-list" id="inboxList" aria-live="polite">
        <!-- dynamic content -->
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="emailModal" role="dialog" aria-modal="true" aria-labelledby="modalSubject">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-subject" id="modalSubject">Tiêu đề email</h3>
        <button class="modal-close-btn" onclick="closeModal()" aria-label="Close email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function() {
      let timerInterval = null;
      let refreshInterval = null;
      let timeLeft = 600;
      let currentEmail = '';
      let emailLogin = '';
      let emailDomain = '';
      let lastSeenMessageIds = new Set();
      let isGenerating = false;

      const TIMER_DURATION = 600;
      const API_BASE = 'https://www.1secmail.com/api/v1/';
      const DOMAINS = ['1secmail.com', '1secmail.org', '1secmail.net', 'wwjmp.com', 'esiix.com', 'xojxa.com', 'yoggm.com'];

      const emailAddressEl = document.getElementById('emailAddress');
      const timerEl = document.getElementById('timer');
      const timerBarFill = document.getElementById('timerBarFill');
      const inboxListEl = document.getElementById('inboxList');
      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const modalOverlay = document.getElementById('emailModal');
      const modalSubject = document.getElementById('modalSubject');
      const modalMeta = document.getElementById('modalMeta');
      const modalBody = document.getElementById('modalBody');
      const toastContainer = document.getElementById('toastContainer');

      async function apiFetch(endpoint) {
        const url = API_BASE + endpoint;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }
        return await response.json();
      }

      function formatDate(dateStr) {
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return 'N/A';
          const now = new Date();
          const diffMs = now - d;
          const diffMin = Math.floor(diffMs / 60000);
          if (diffMin < 1) return 'Just now';
          if (diffMin < 60) return diffMin + ' min ago';
          const diffHr = Math.floor(diffMin / 60);
          if (diffHr < 24) return diffHr + ' hr ago';
          return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        } catch(e) {
          return 'N/A';
        }
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('removing');
          setTimeout(() => {
            if (toast.parentNode) toast.remove();
          }, 260);
        }, 2800);
      }

      function showLoading() {
        emailAddressEl.textContent = 'Đang tạo email...';
        inboxListEl.innerHTML = `
          <div class="skeleton">
            <div class="skeleton-item">
              <div class="skeleton-avatar"></div>
              <div class="skeleton-lines">
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line short"></div>
              </div>
            </div>
          </div>
        `;
      }

      function showInboxError(message = 'Unable to load inbox') {
        inboxListEl.innerHTML = `
          <div class="error-state">
            <div class="error-state-title">Something went wrong</div>
            <div class="error-state-text">${escapeHtml(message)}</div>
          </div>
        `;
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = TIMER_DURATION;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            showToast('Email has expired. Generate a new one.', 'warning');
          }
        }, 1000);
      }

      function resetTimer() {
        if (timerInterval) clearInterval(timerInterval);
        startTimer();
      }

      function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const timeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        timerEl.textContent = timeStr;

        const progress = Math.max(0, Math.min(100, (timeLeft / TIMER_DURATION) * 100));
        timerBarFill.style.width = progress + '%';

        timerEl.classList.remove('warning', 'danger');
        timerBarFill.classList.remove('warning', 'danger');
        if (timeLeft <= 60) {
          timerEl.classList.add('danger');
          timerBarFill.classList.add('danger');
        } else if (timeLeft <= 180) {
          timerEl.classList.add('warning');
          timerBarFill.classList.add('warning');
        }
      }

      function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
          if (!isGenerating) {
            refreshInbox();
          }
        }, 10000);
      }

      function generateEmail() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 10; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
      }

      async function createNewEmail() {
        try {
          isGenerating = true;
          generateBtn.disabled = true;
          copyBtn.disabled = true;
          refreshBtn.disabled = true;
          showLoading();

          emailLogin = generateEmail();
          emailDomain = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
          currentEmail = `${emailLogin}@${emailDomain}`;
          
          emailAddressEl.textContent = currentEmail;
          lastSeenMessageIds.clear();
          
          // Check inbox immediately
          await refreshInbox();
          showToast('Email created', 'success');
        } catch (error) {
          console.error('Email creation error:', error);
          showToast('Unable to create email. Please try again.', 'error');
          emailAddressEl.textContent = 'Error creating email';
          inboxListEl.innerHTML = `
            <div class="error-state">
              <div class="error-state-title">Connection error</div>
              <div class="error-state-text">Check your internet connection and try again.</div>
            </div>
          `;
        } finally {
          isGenerating = false;
          generateBtn.disabled = false;
          copyBtn.disabled = false;
          refreshBtn.disabled = false;
        }
      }

      async function generateNewEmail() {
        if (isGenerating) return;
        if (!confirm('Are you sure you want to generate a new email? The current inbox will be lost.')) {
          return;
        }
        try {
          await createNewEmail();
          resetTimer();
          startAutoRefresh();
        } catch (error) {
          console.error('Generate new email error:', error);
        }
      }

      async function refreshInbox() {
        if (!emailLogin || !emailDomain) return;
        try {
          const messages = await apiFetch(`?action=getMessages&login=${emailLogin}&domain=${emailDomain}`);
          
          if (Array.isArray(messages)) {
            displayEmails(messages);
          } else {
            displayEmails([]);
          }
        } catch (error) {
          console.error('Refresh inbox error:', error);
          showInboxError('Unable to load inbox. Check your connection.');
        }
      }

      function displayEmails(messages) {
        if (!messages || messages.length === 0) {
          inboxListEl.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-6l-2 3h-4l-2-3H2"></path>
                <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
              </svg>
              <div class="empty-state-title">Your inbox is empty</div>
              <div class="empty-state-text">Emails sent to this address will appear here.</div>
            </div>
          `;
          return;
        }

        messages.sort((a, b) => new Date(b.date) - new Date(a.date));

        let html = '';
        messages.forEach(message => {
          const from = message.from || 'Unknown sender';
          const subject = message.subject || 'No subject';
          const time = formatDate(message.date);
          const messageId = message.id;
          const isUnread = !lastSeenMessageIds.has(messageId);
          const unreadClass = isUnread ? 'unread' : '';

          html += `
            <div class="email-item ${unreadClass}" tabindex="0" role="button" aria-label="Open email from ${escapeHtml(from)}" data-message-id="${messageId}">
              <span class="unread-indicator" aria-hidden="true"></span>
              <div class="email-item-content">
                <div class="email-item-sender">${escapeHtml(from)}</div>
                <div class="email-item-subject">${escapeHtml(subject)}</div>
              </div>
              <div class="email-item-time">${escapeHtml(time)}</div>
            </div>
          `;
        });

        inboxListEl.innerHTML = html;

        document.querySelectorAll('.email-item').forEach(item => {
          item.addEventListener('click', function(e) {
            const messageId = this.dataset.messageId;
            lastSeenMessageIds.add(messageId);
            this.classList.remove('unread');
            openEmail(messageId);
          });
          item.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.click();
            }
          });
        });
      }

      async function openEmail(messageId) {
        try {
          const message = await apiFetch(`?action=readMessage&login=${emailLogin}&domain=${emailDomain}&id=${messageId}`);

          modalSubject.textContent = message.subject || 'No subject';

          const from = message.from || 'Unknown';
          const receivedAt = message.date ? formatDate(message.date) : 'N/A';

          modalMeta.innerHTML = `
            <div class="modal-meta-row"><span class="modal-meta-label">From:</span> ${escapeHtml(from)}</div>
            <div class="modal-meta-row"><span class="modal-meta-label">Received:</span> ${escapeHtml(receivedAt)}</div>
          `;

          let content = '';
          if (message.textBody) {
            content = `<pre style="white-space:pre-wrap;font-family:var(--font);font-size:0.9rem;line-height:1.6;">${escapeHtml(message.textBody)}</pre>`;
          } else if (message.body) {
            content = `<pre style="white-space:pre-wrap;font-family:var(--font);font-size:0.9rem;line-height:1.6;">${escapeHtml(message.body)}</pre>`;
          } else {
            content = '<p style="color:var(--text-secondary);">No content</p>';
          }

          modalBody.innerHTML = content;
          modalOverlay.classList.add('active');
          document.body.style.overflow = 'hidden';
        } catch (error) {
          console.error('Open email error:', error);
          showToast('Unable to read email', 'error');
        }
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
        modalBody.innerHTML = '';
      }

      function copyEmail() {
        if (!currentEmail) return;
        navigator.clipboard.writeText(currentEmail).then(() => {
          showToast('Email copied', 'success');
        }).catch(() => {
          const textArea = document.createElement('textarea');
          textArea.value = currentEmail;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
          showToast('Email copied', 'success');
        });
      }

      async function init() {
        try {
          await createNewEmail();
          startTimer();
          startAutoRefresh();
        } catch (error) {
          console.error('Init error:', error);
          showToast('Unable to start. Please refresh the page.', 'error');
        }

        modalOverlay.addEventListener('click', function(e) {
          if (e.target === modalOverlay) {
            closeModal();
          }
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
            closeModal();
          }
        });
      }

      window.copyEmail = copyEmail;
      window.refreshInbox = refreshInbox;
      window.generateNewEmail = generateNewEmail;
      window.closeModal = closeModal;

      init();
    })();
  </script>
</body>
</html>
