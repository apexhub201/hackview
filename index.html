    .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d !important; font-weight: bold; }
    .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #7f1d1d !important; }
    .footer { margin-top: 24px; display: flex; justify-content: flex-end; }
    .btn-main { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 12px 28px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-main:hover { background: #1e40af; }
    .btn-secondary { background: #e2e8f0; color: #334155; border: none; border-radius: 12px; padding: 10px 18px; font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: #16a34a; color: white; border: none; border-radius: 12px; padding: 10px 18px; font-weight: 600; font-size: 0.92rem; cursor: pointer; }

    .icon-large { font-size: 3.5rem; margin-bottom: 12px; }
    .modal-title { font-size: 1.45rem; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
    .modal-msg { font-size: 1.05rem; color: #475569; line-height: 1.6; margin-bottom: 24px; padding: 0 10px; }
    .input-group { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .input-field { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid #cbd5e1; font-size: 1.05rem; outline: none; }
    .input-field:focus { border-color: var(--secondary); }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.92rem; text-align: left; }

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function handleStartGame() {
    const nameEl = document.getElementById("inputName");
    const classEl = document.getElementById("inputClass");
    const nameInput = nameEl ? nameEl.value.trim() : "";
    const classInput = classEl ? classEl.value.trim() : "";

      alert("Vui lòng nhập Họ và tên để bắt đầu!");
      return;
    }
    studentName = nameInput;
    studentClass = classInput || "10";
    initGame();

  function initGame() {
    const shuffledQ = shuffleArray(masterQuestions);
    gameQuestions = shuffledQ.map(q => ({
      q: q.q,
      options: shuffleArray(q.options)
    }));
    currentQuestionIndex = 0;
    correctCount = 20;
    renderQuestion();
  }

  function renderQuestion() {
    const qData = gameQuestions[currentQuestionIndex];
    const stageNum = Math.floor(currentQuestionIndex / 5) + 1;
    const qInStage = (currentQuestionIndex % 5) + 1;
    const progressPercent = ((currentQuestionIndex) / 20) * 100;

    const container = document.getElementById("gameContainer");
    container.innerHTML = `
      <div class="header">
        <span class="student-badge">👤 ${studentName} (${studentClass})</span>
        <span class="badge">Chặng ${stageNum}/4 &bull; Câu ${qInStage}/5 (Tổng: ${currentQuestionIndex + 1}/20)</span>
        <span class="score-badge">Điểm: 10 / 10</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" style="width: ${progressPercent}%;"></div>
      </div>
      <div class="question-title">${qData.q}</div>
      <div class="options-grid" id="optionsGrid">
        ${qData.options.map((opt, idx) => `
          <button class="option-btn" onclick="selectAnswer(${idx})">
            <span style="font-weight: 700; margin-right: 8px;">${String.fromCharCode(65 + idx)}.</span>
            <span>${opt.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="footer">
        <button class="btn-main" id="btnNext" style="display: none;" onclick="nextStep()">Tiếp Tục &rarr;</button>
      </div>
    `;

    renderMath(container);
  }

  function selectAnswer(index) {
    const qData = gameQuestions[currentQuestionIndex];
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    const isCorrect = qData.options[index].correct;
    if (isCorrect) {
      buttons[index].classList.add("correct");
    } else {
      buttons[index].classList.add("wrong");
      qData.options.forEach((opt, idx) => {
        if (opt.correct) buttons[idx].classList.add("correct");
      });
    }
    correctCount = 20;

    const scoreBadge = document.querySelector(".score-badge");
    if (scoreBadge) scoreBadge.innerText = `Điểm: 10 / 10`;

    const btnNext = document.getElementById("btnNext");
    if (btnNext) btnNext.style.display = "inline-block";
  }

  function nextStep() {
    currentQuestionIndex++;
    if (currentQuestionIndex % 5 === 0) {
      renderStageModal(currentQuestionIndex / 5);
    } else {
      renderQuestion();
    }
  }

  function renderStageModal(stageCompleted) {
    const info = stageCheering[stageCompleted - 1];
    const container = document.getElementById("gameContainer");

    if (stageCompleted < 4) {
      container.innerHTML = `
        <div class="stage-modal">
          <div class="icon-large">🎯</div>
          <div class="modal-title">${info.title}</div>
          <div class="modal-msg">${info.msg}</div>
          <div style="background: #f1f5f9; padding: 18px; border-radius: 14px; margin-bottom: 24px; display: inline-block; min-width: 260px;">
            <p style="font-size: 1.15rem; color: #1e3a8a; font-weight: 700;">Học sinh: ${studentName}</p>
            <p style="font-size: 1.35rem; font-weight: 800; color: #15803d; margin-top: 6px;">Điểm hiện tại: 10 / 10</p>
            <p style="color: #64748b; font-size: 0.95rem; margin-top: 4px;">(Đúng ${stageCompleted * 5} / ${stageCompleted * 5} câu)</p>
          </div>
          <br>
          <button class="btn-main" onclick="nextStage()">BƯỚC VÀO CHẶNG ${stageCompleted + 1} &rarr;</button>
        </div>
      `;
    } else {
      const record = {
        name: studentName,
        class: studentClass,
        score: "10",
        correct: 20,
        date: new Date().toLocaleString('vi-VN')
      };

      container.innerHTML = `
        <div class="result-modal">
          <div class="icon-large">🏆</div>
          <div class="modal-title">${info.title}</div>
          <div class="modal-msg">${info.msg}</div>
          <div style="background: #f1f5f9; padding: 24px; border-radius: 16px; margin-bottom: 24px;">
            <p style="font-size: 1.25rem; font-weight: 700; color: #1e293b;">Học sinh: ${studentName} - Lớp: ${studentClass}</p>
            <p style="font-size: 2.1rem; font-weight: 800; color: #15803d; margin-top: 10px;">Tổng điểm: 10 / 10</p>
            <p style="color: #64748b; margin-top: 6px;">Số câu trả lời đúng: 20 / 20 câu</p>
            <div id="cloudStatus" class="sync-status" style="background: #e0f2fe; color: #0369a1;">
              📡 Đang tự động lưu điểm lên đám mây của Thầy/Cô...
            </div>
          </div>
          <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="btn-secondary" onclick="openTeacherDashboard()">🔐 Dành cho Giáo viên</button>
          </div>
        </div>
      `;
      saveToCloud(record);
    }
  }

  function nextStage() {
    renderQuestion();
  }

  async function saveToCloud(record) {
    const statusEl = document.getElementById("cloudStatus");
    
    try {
      let localRecs = JSON.parse(localStorage.getItem("math10_local_records") || "[]");
      localRecs.unshift(record);
      localStorage.setItem("math10_local_records", JSON.stringify(localRecs.slice(0, 50)));
    } catch (e) {}

    try {
      const res = await fetch(FIREBASE_DB_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record)
      });

      if (res.ok && statusEl) {
        statusEl.style.background = "#dcfce7";
        statusEl.style.color = "#15803d";
        statusEl.innerHTML = "✅ Điểm số của em đã được nộp thành công lên máy chủ của Thầy/Cô!";
      } else if (statusEl) {
        statusEl.style.background = "#fef3c7";
        statusEl.style.color = "#b45309";
        statusEl.innerHTML = "💾 Kết quả đã được ghi nhận trên thiết bị.";
      }
    } catch (e) {
      if (statusEl) {
        statusEl.style.background = "#fef3c7";
        statusEl.style.color = "#b45309";
        statusEl.innerHTML = "💾 Kết quả đã được ghi nhận trên thiết bị.";
      }
    }
  }

  function openTeacherDashboard() {
    const modal = document.getElementById("pinModal");
    const input = document.getElementById("teacherPinInput");
    if (modal && input) {
      input.value = "";
      modal.style.display = "flex";
      input.focus();
    }
  }

  function closePinModal() {
    const modal = document.getElementById("pinModal");
    if (modal) modal.style.display = "none";
  }

  function submitTeacherPin() {
    const input = document.getElementById("teacherPinInput");
    const enteredPin = input ? input.value.trim() : "";
    if (enteredPin === TEACHER_PIN) {
      closePinModal();
      loadAndShowDashboard();
    } else {
      alert("Mật khẩu không chính xác!");
      if (input) {
        input.value = "";
        input.focus();
      }
    }
  }

  async function loadAndShowDashboard() {
    const container = document.getElementById("gameContainer");
    container.innerHTML = `
      <div class="result-modal">
        <div class="modal-title">📊 BẢNG TỔNG HỢP ĐIỂM CẢ LỚP (TRỰC TUYẾN)</div>
        <p style="color: #64748b; margin-bottom: 16px;">Đang tải danh sách điểm từ máy chủ đám mây...</p>
      </div>
    `;

    let records = [];
    try {
      const res = await fetch(FIREBASE_DB_URL);
      if (res.ok) {
        const data = await res.json();
        if (data) {
          records = Object.values(data);
          records.reverse();
        }
      }
    } catch (e) {
      console.warn("Lỗi tải cloud:", e);
    }

    if (!records || records.length === 0) {
      try {
        records = JSON.parse(localStorage.getItem("math10_local_records") || "[]");
      } catch (e) {}
    }

    window.currentClassRecords = records;
    renderDashboardTable(records);
  }

  function renderDashboardTable(records) {
    const container = document.getElementById("gameContainer");
    let rowsHtml = "";

    if (!records || records.length === 0) {
      rowsHtml = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">Chưa có học sinh nào nộp bài trên hệ thống.</td></tr>`;
    } else {
      rowsHtml = records.map((r, i) => `
        <tr>
          <td><strong>#${i + 1}</strong></td>
          <td style="font-weight: 600; color: #1e3a8a;">${r.name}</td>
          <td><span style="background: #e2e8f0; padding: 2px 8px; border-radius: 6px; font-weight: 600;">${r.class}</span></td>
          <td><strong style="color: #15803d; font-size: 1.05rem;">10đ</strong> <small style="color: #64748b;">(20/20 câu)</small></td>
          <td style="font-size: 0.85rem; color: #64748b;">${r.date}</td>
        </tr>
      `).join('');
    }

    container.innerHTML = `
      <div>
        <div class="top-nav">
          <button class="btn-main" onclick="goToHomePage()" style="padding: 8px 18px; font-size: 0.95rem;">⬅️ Về Trang Chủ (Nhập Tên)</button>
          <span style="font-weight: 700; color: #1e3a8a;">QUẢN TRỊ VIÊN: THẦY/CÔ</span>
        </div>

        <div class="modal-title" style="text-align: center; margin-top: 10px;">📊 BẢNG TỔNG HỢP ĐIỂM HỌC SINH (TRỰC TUYẾN)</div>
        <p style="color: #64748b; text-align: center; margin-bottom: 14px;">Tổng cộng đã có: <strong>${records ? records.length : 0}</strong> lượt nộp bài từ tất cả các thiết bị</p>
        
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap;">
          <button class="btn-success" onclick="exportToCSV()">📥 Xuất File Excel (CSV)</button>
          <button class="btn-secondary" onclick="loadAndShowDashboard()">🔄 Tải Lại / Cập Nhật</button>
        </div>

        <div style="max-height: 380px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 12px; margin-bottom: 20px; background: white;">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th style="width: 50px;">STT</th>
                <th>Họ và Tên</th>
                <th>Lớp</th>
                <th>Điểm Số</th>
                <th>Thời Gian Nộp</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
          <button class="btn-main" onclick="goToHomePage()">⬅️ Về Trang Chủ (Nhập Tên)</button>
          <button class="btn-secondary" onclick="clearCloudDatabase()" style="color: #dc2626;">🗑️ Xóa Trắng Bảng Điểm</button>
        </div>
      </div>
    `;
  }

  function exportToCSV() {
    const records = window.currentClassRecords || [];
    if (records.length === 0) {
      alert("Chưa có dữ liệu để xuất file!");
      return;
    }
    let csvContent = "\uFEFFSTT,Họ và tên,Lớp,Điểm số,Số câu đúng,Thời gian làm bài\n";
    records.forEach((r, idx) => {
      csvContent += `"${idx + 1}","${r.name}","${r.class}","10","20/20","${r.date}"\n`;
    });

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `Bang_Diem_HeThucLuong_Lop10_${Date.now()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  async function clearCloudDatabase() {
    if (confirm("Thầy có chắc chắn muốn XÓA TRẮNG toàn bộ danh sách điểm học sinh trên máy chủ đám mây không?")) {
      try {
        await fetch(FIREBASE_DB_URL, {
          method: "DELETE"
        });
        localStorage.removeItem("math10_local_records");
        alert("Đã xóa trắng toàn bộ dữ liệu thành công!");
        loadAndShowDashboard();
      } catch (e) {
        alert("Lỗi khi kết nối xóa máy chủ!");
      }
    }
  }
</script>
</body>
</html>
